<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Formulários </title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">

    
</head>
<body>

    <div class= "container-fluid">
    <h3> Exemplo de Formulário </h3>
    <form method="get" action="cadastro.php">
     <fieldset> <legend> Dados Pessoais </legend> 

    <div class = "estilosCampos">
        <label for="enNome"> Nome: </label>
        <input type="text" name="nome" id="enNome" required placeholder="Informe seu nome completo" maxlength="50" minlength="10" >
    </div>

    <div class = "estilosCampos">
        <label for="enEmail"> E-mail: </label>
        <input type="email" name="email" id="enEmail">
    </div>

    <div class = "estilosCampos">
        <label for="enTel"> Telefone: </label>
        <input type="tel" name="telefone" id="enTel" pattern="\([0-9]{2}\)[0-9]{4}[0-9]{4}">
    </div>

        <label for="enSenha"> Senha: </label>
        <input type="password" name="senha" id="enSenha" autofocus placeholder="Informe a senha com  5" required autocomplete="off">

        <label for="enFile"> Entre com sua cópia de RG: </label>
        <input type="file" name="arqRG" id="enFile" multiple >
        <br>
        <label for="enData"> Data: </label>
        <input type="date" name="dataCadastro" id="enData">
    </fieldset>
        <br>
        <fieldset> <legend> Dados da Compra: </legend>
        <label for="enCor" > Cor do sapato: </label>
        <input type="color" name="cor" id="enCor" >
        <label for="formPag"> Forma de Pagamento: </label>
        <input type="radio" name="formPag" id="formPagB" value = "boleto" checked> Boleto Bancário
        <input type="radio" name="formPag" id="formPagD" value = "débito"> Cartão de Débito
        <input type="radio" name="formPag" id="formPagC" value = "crédito"> Cartão de Crédito

        <div class = "estilosCampos">
        <label for="endEntrega"> Endereços para Entrega: </label>
        <input type="checkbox" name="enderecos" id="endPrinc" value = "Endereço Principal" checked> Endereço Principal
        <input type="checkbox" name="enderecos" id="endComerc" value = "Endereço Comercial"> Endereço Comercial
        <input type="checkbox" name="enderecos" id="endExtra" value = "Endereço Extra"> Endereço Extra
        </div>

        <div class = "estilosCampos">
            <label for="idEstados"> Estados: </label>
            <select name="estados" id="idEstados"> 
                <optgroup label = "Sudeste"> 
                    <option value="SP"> São Paulo </option>
                    <option value="MG"> Minas Gerais </option>
                </optgroup>

                <optgroup label = "Sul">
                    <option value="RS"> Rio Grande do Sul </option>
                    <option value="PR"> Paraná </option>
                </optgroup>
            </select>
        </div>

        <div class = "estilosCampos">
            <label for="qtd"> Quantidade: </label>
            <input type="number" name="qtdC" id="qtd" min = 0 max = 5>
        </div>

        <div class = "estilosCampos">
            <label for= "nivelSat"> Nivel de Satisfação: </label>
            <input type="range" name="nivelS" id="nivelSat" min = 0 max = 10>
        </div>

        <label for="comentarios"> Comentários/Sugestões: </label>
        <textarea name="coment" id="coment" cols="42" rows="5"> Digite aqui seus comentários/sugestões...

        </textarea>


        </fieldset>

        <br><br>

        <input type="submit" value="Cadastrar">
        <input type="reset" value="Limpar">

    </form>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-Piv4xVNRyMGpqkS2by6br4gNJ7DXjqk09RmUpJ8jgGtD7zP9yug3goQfGII0yAns" crossorigin="anonymous"></script>
</div>
</body>
</html>
