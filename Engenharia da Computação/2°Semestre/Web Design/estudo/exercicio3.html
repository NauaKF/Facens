<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Cadastro de Clientes </title>
</head>
<h3> Formulário para Cadastro de Clientes </h3>
<body>
    <form action="formulario">
    <label for="name"> Nome: </label>
        <input type="text" name="Nome" size="20" maxlength="50" id="idnome"> <br><br>
    
    <label for="email"> E-mail: </label>
        <input type="email" name="E-mail" size="20" maxlength="100" id="idemail"> <br><br>
   
    <label for="sexo"> Sexo: </label>
        <input type="radio" name="sexos" id="female" value="Feminino"> Feminino
        <input type="radio" name="sexos" id="male" value = "Masculino"> Masculino <br><br>

    <label for="rg"> RG: </label>
        <input type="text" name="RG" maxlength="9" id="idrg"> <br><br>

    <label for="cpf"> CPF: </label>
        <input type="text" name="CPF" maxlength="11" id="idcpf"> <br><br>

    <label for="login"> Login: </label>
        <input type="text" name="login" id="usuario"> <br><br>
    
    <label for="senha"> Senha: </label>
    Senha: <input type="password" name="senha" id="idsenha"> <br><br>
    
    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar">
</form>
</body>
</html>
