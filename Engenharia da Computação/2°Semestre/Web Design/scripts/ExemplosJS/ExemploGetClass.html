<body>

    <script>

        {
            var nome = document.getElementsByClassName('entrada')[0].value;
            var nomeF = document.forms['formularioEntrada']['nome'].value;
            var senhaF = document.forms['formularioEntrada']['senha'].value;
        }
    </script>


</body>
