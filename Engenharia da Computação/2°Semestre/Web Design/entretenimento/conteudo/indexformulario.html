<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">
    
    <title> Exemplo de Formulário </title>
    
<body>
  <h6> Ageência Lual de Viagens </h6>
    <div class="container">
        <div class="row" id="um">
          <div class="col-sm">
            <label>Email</label><br>
            <input type="text" class="form-control">
          </div>
          <div class="col-sm">
            <label>Nome do cliente</label><br>
            <input type="text" class="form-control">
          </div>
        </div>
        <!--segunda coluna com 3 bgl--><br>
        <div class="row">
            <div class="col-sm" id="dois">
              Pacote de Viagens Destino
              <div style="display: flex;">
                <input type="radio" name="viagens">
                RS - Gramado
                <input type="radio" name="viagens">

                SP - SP
                <input type="radio" name="viagens">
                MG - Ouropreto
              </div>
            </div>

            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" id="inlineCheckbox1" value="option1">
                <label class="form-check-label" for="inlineCheckbox1">Tour</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" id="inlineCheckbox2" value="option2">
                <label class="form-check-label" for="inlineCheckbox2">Empresas</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" id="inlineCheckbox3" value="option3">
                <label class="form-check-label" for="inlineCheckbox3">Jantares</label>
              </div>

            <div class="col-sm">
              <label>Empresas Aéreas</label>
              <select class="form-control">
                  <option>Azul</option>
                  <option>Gol</option>
                  <option>Emirates</option>
                  </optgroup>
              </select>
            </div>
          
        </div>

        <div class="row"> 
            <div class="col-sm"  style="margin-bottom: 10px">
                <br>
                    <div style="display: flex; justify-content: center; align-items: center;">
                    <button class="btn btn-primary">Calcular pacote</button>
                    <button class="btn btn-primary">Limpar</button>
                    <button class="btn btn-primary">Imprimir</button>
                    </div>
                
            </div>
        </div>

        <br><br>
        <div class="row" id="final">
            <div class="col-sm">
                Total do pacote: <br>
                <textarea name="coment" id="coment" cols="30" rows="1" style="width: 100%;"> </textarea> <br><br>
                Descrição do pacote <br>
                <textarea name="coment" id="coment" cols="30" rows="5" style="width: 100%;"> </textarea> <br><br>

            </div>
        </div>

</body>
</html>
